name: Deploy AWS Tests

on:
  push:
    paths:
      - 'deploy/aws/**'
      - '.github/workflows/deploy-aws-tests.yml'
  pull_request:
    paths:
      - 'deploy/aws/**'
      - '.github/workflows/deploy-aws-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run tests
        run: uv run pytest

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws/src/glow_deploy/gui/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: deploy/aws/src/glow_deploy/gui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check
