name: Deploy AWS Tests

on:
  push:
    paths:
      - 'deploy/aws/**'
      - '.github/workflows/deploy-aws-tests.yml'
  pull_request:
    paths:
      - 'deploy/aws/**'
      - '.github/workflows/deploy-aws-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Run tests
        run: uv run pytest

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws/src/glow_deploy/gui/frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: deploy/aws/src/glow_deploy/gui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build test bundle
        run: npx tsc -p tsconfig.test.json

      - name: Test
        run: node --test "test/*.test.js"
