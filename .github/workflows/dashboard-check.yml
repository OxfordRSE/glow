name: Dashboard Check

on:
  push:
    paths:
      - 'dashboard/**'
      - 'api/examples/**'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'api/examples/**'

jobs:
  detect-playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read resolved playwright version from lockfile
        id: detect
        run: |
          version=$(node -p "require('./dashboard/package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check:
    needs: detect-playwright-version
    runs-on: ubuntu-latest
    container:
      # Image tag is derived from the playwright version actually resolved in
      # package-lock.json, so it can't drift out of sync with the installed browsers.
      image: mcr.microsoft.com/playwright:v${{ needs.detect-playwright-version.outputs.version }}-noble
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate contract examples
        run: npm run generate:examples

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
