name: GUI Release

on:
  push:
    tags:
      - 'gui-v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TERRAFORM_VERSION: '1.9.8'
  PACKER_VERSION: '1.11.2'

jobs:
  build:
    strategy:
      fail-fast: false
      # One native runner per OS. GitHub's macos-latest runners are Apple
      # Silicon (arm64) — an Intel-mac build isn't produced here; add a
      # macos-13 (amd64) leg to this matrix if that gap matters later.
      matrix:
        include:
          - os: windows-latest
            platform: windows
            hashicorp_os: windows
            hashicorp_arch: amd64
          - os: macos-latest
            platform: macos
            hashicorp_os: darwin
            hashicorp_arch: arm64
          - os: ubuntu-latest
            platform: linux
            hashicorp_os: linux
            hashicorp_arch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: deploy/aws/src/glow_deploy/gui/frontend/package-lock.json

      - name: Build frontend (tsc)
        working-directory: deploy/aws/src/glow_deploy/gui/frontend
        run: |
          npm ci
          npm run build

      - name: Write version file
        shell: bash
        working-directory: deploy/aws
        run: echo "${GITHUB_REF_NAME}" > src/glow_deploy/gui/VERSION

      - name: Download terraform and packer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: deploy/aws
        run: |
          set -euo pipefail
          mkdir -p src/glow_deploy/gui/bin
          curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_${{ matrix.hashicorp_os }}_${{ matrix.hashicorp_arch }}.zip" -o /tmp/terraform.zip
          curl -fsSL "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_${{ matrix.hashicorp_os }}_${{ matrix.hashicorp_arch }}.zip" -o /tmp/packer.zip
          unzip -o /tmp/terraform.zip -d src/glow_deploy/gui/bin
          unzip -o /tmp/packer.zip -d src/glow_deploy/gui/bin
          chmod +x src/glow_deploy/gui/bin/*

      - name: Download terraform and packer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: deploy/aws
        run: |
          New-Item -ItemType Directory -Force -Path src/glow_deploy/gui/bin | Out-Null
          Invoke-WebRequest -Uri "https://releases.hashicorp.com/terraform/$env:TERRAFORM_VERSION/terraform_${env:TERRAFORM_VERSION}_${{ matrix.hashicorp_os }}_${{ matrix.hashicorp_arch }}.zip" -OutFile terraform.zip
          Invoke-WebRequest -Uri "https://releases.hashicorp.com/packer/$env:PACKER_VERSION/packer_${env:PACKER_VERSION}_${{ matrix.hashicorp_os }}_${{ matrix.hashicorp_arch }}.zip" -OutFile packer.zip
          Expand-Archive -Path terraform.zip -DestinationPath src/glow_deploy/gui/bin -Force
          Expand-Archive -Path packer.zip -DestinationPath src/glow_deploy/gui/bin -Force

      - name: Install Python dependencies
        working-directory: deploy/aws
        run: uv sync

      - name: Build with PyInstaller
        working-directory: deploy/aws
        run: uv run pyinstaller --noconfirm --clean src/glow_deploy/gui/pyinstaller.spec

      - name: Package Linux artifact
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: deploy/aws
        run: |
          set -euo pipefail
          OUT=glow-deploy-linux-amd64
          if bash ../../.github/scripts/build-appimage.sh dist/glow-deploy "$OUT"; then
            echo "artifact=${OUT}.AppImage" >> "$GITHUB_ENV"
          else
            echo "AppImage packaging failed — falling back to a plain tarball" >&2
            tar -C dist -czf "${OUT}.tar.gz" glow-deploy
            echo "artifact=${OUT}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Package macOS artifact
        if: matrix.platform == 'macos'
        shell: bash
        working-directory: deploy/aws
        run: |
          set -euo pipefail
          OUT=glow-deploy-macos-arm64.tar.gz
          tar -C dist -czf "$OUT" glow-deploy
          echo "artifact=${OUT}" >> "$GITHUB_ENV"

      - name: Package Windows artifact
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: deploy/aws
        run: |
          $out = "glow-deploy-windows-amd64.zip"
          Compress-Archive -Path dist/glow-deploy.exe -DestinationPath $out
          echo "artifact=$out" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: deploy/aws/${{ env.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
