<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Glow Deploy — {{ deployment.domain }} advanced</title>
</head>
<body>
  <h1>{{ deployment.domain }} — advanced</h1>
  <p><a href="/deployments/{{ deployment.domain }}">Back</a></p>
  <dl>
    <dt>Instance ID</dt><dd>{{ deployment.instance_id }}</dd>
    <dt>State</dt><dd>{{ deployment.state }}</dd>
    <dt>Git ref</dt><dd>{{ deployment.git_ref }}</dd>
    <dt>Git commit</dt><dd>{{ deployment.git_commit }}</dd>
    <dt>Launch time</dt><dd>{{ deployment.launch_time }}</dd>
  </dl>
</body>
</html>
