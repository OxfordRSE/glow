{% extends "base.html" %}
{% block title %}Sign in — Glow Deploy{% endblock %}
{% block content %}
  <h1>Sign in to AWS</h1>

  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}

  <section class="card">
    <h2>Sign in with AWS SSO</h2>
    <form method="post" action="/signin/sso/start">
      <label>SSO start URL
        <input type="url" name="start_url" required placeholder="https://my-org.awsapps.com/start">
      </label>
      <label>Region
        <input type="text" name="region" value="eu-west-2" required>
      </label>
      <button type="submit" class="button">Sign in</button>
    </form>
  </section>

  <details class="card">
    <summary>Advanced: manual access keys</summary>
    <form method="post" action="/signin/manual">
      <label>Access key ID
        <input type="text" name="access_key" required>
      </label>
      <label>Secret access key
        <input type="password" name="secret_key" required>
      </label>
      <label>Session token (optional)
        <input type="password" name="session_token">
      </label>
      <label>Region
        <input type="text" name="region" value="eu-west-2" required>
      </label>
      <button type="submit" class="button">Sign in</button>
    </form>
  </details>
{% endblock %}
